<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لعبة عبود</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #eee;
    padding: 6px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    gap: 6px;
  }
  .top-bar {
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 17px;
    background: linear-gradient(90deg, #00d4ff, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 2px;
  }
  .welcome {
    font-size: 11px;
    color: #00d4ff;
    margin-bottom: 2px;
  }
  .info {
    display: flex;
    gap: 20px;
    font-size: 13px;
    justify-content: center;
  }
  .info span { color: #00ff88; font-weight: bold; }

  canvas {
    background: #0f0f1e;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    border: 2px solid #00d4ff;
    display: block;
    max-width: 88vw;
    max-height: 38vh;
    width: auto;
    height: auto;
    touch-action: none;
  }

  .mobile-pad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    grid-template-areas:
      ". up ."
      "left . right"
      ". down .";
    gap: 8px;
    direction: ltr;
    justify-content: center;
    margin-top: 4px;
  }
  .mobile-pad button {
    padding: 0;
    font-size: 22px;
    border-radius: 12px;
    background: linear-gradient(135deg, #00d4ff, #00ff88);
    color: #1a1a2e;
    border: none;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 3px 10px rgba(0, 212, 255, 0.4);
  }
  .mobile-pad button:active {
    transform: scale(0.9);
    filter: brightness(1.3);
  }
  .mobile-pad button[data-dir="up"]    { grid-area: up; }
  .mobile-pad button[data-dir="left"]  { grid-area: left; }
  .mobile-pad button[data-dir="right"] { grid-area: right; }
  .mobile-pad button[data-dir="down"]  { grid-area: down; }

  .controls button {
    padding: 10px 24px;
    font-size: 14px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #00d4ff, #00ff88);
    color: #1a1a2e;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
  }
  .controls button:active { transform: scale(0.95); }

  @media (max-height: 680px) {
    h1 { font-size: 15px; }
    .welcome { display: none; }
    canvas { max-height: 34vh; }
    .mobile-pad {
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 6px;
    }
    .mobile-pad button { font-size: 18px; }
    .controls button { padding: 8px 20px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1>🐍 لعبة عبود</h1>
  <div class="welcome" id="welcome"></div>
  <div class="info">
    <div>النقاط: <span id="score">0</span></div>
    <div>الأعلى: <span id="best">0</span></div>
  </div>
</div>

<canvas id="game" width="400" height="400"></canvas>

<div class="mobile-pad">
  <button data-dir="up">▲</button>
  <button data-dir="left">◀</button>
  <button data-dir="right">▶</button>
  <button data-dir="down">▼</button>
</div>

<div class="controls">
  <button id="restart">🔄 إعادة</button>
</div>

<script>
if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  const user = Telegram.WebApp.initDataUnsafe?.user;
  if (user) {
    document.getElementById('welcome').textContent = 'أهلاً ' + (user.first_name || 'لاعب') + ' 👋';
  }
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, best, alive, timer;

best = parseInt(localStorage.getItem('snakeBest') || '0');
bestEl.textContent = best;

// السرعة تتغير حسب النقاط: تبدأ 200ms وتنقص تدريجياً حتى 120ms
function currentSpeed() {
  return Math.max(120, 200 - score * 4);
}

function startTimer() {
  if (timer) clearInterval(timer);
  timer = setInterval(update, currentSpeed());
}

function init() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  alive = true;
  scoreEl.textContent = 0;
  placeFood();
  startTimer();
  draw();
}

function placeFood() {
  let ok = false;
  while (!ok) {
    food = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
    ok = !snake.some(s => s.x === food.x && s.y === food.y);
  }
}

function update() {
  if (!alive) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snakeBest', best);
    }
    placeFood();
    startTimer(); // سرّع اللعبة بعد كل نقطة
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#0f0f1e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * GRID, 0);
    ctx.lineTo(i * GRID, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * GRID);
    ctx.lineTo(canvas.width, i * GRID);
    ctx.stroke();
  }

  const fx = food.x * GRID + GRID / 2;
  const fy = food.y * GRID + GRID / 2;
  ctx.beginPath();
  ctx.arc(fx, fy, GRID / 2 - 2, 0, Math.PI * 2);
  ctx.fillStyle = '#ff3860';
  ctx.shadowColor = '#ff3860';
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;

  snake.forEach((s, i) => {
    const t = i / snake.length;
    ctx.fillStyle = i === 0 ? '#00ff88' : 'hsl(' + (160 - t * 60) + ', 100%, ' + (55 - t * 15) + '%)';
    ctx.shadowColor = i === 0 ? '#00ff88' : 'transparent';
    ctx.shadowBlur = i === 0 ? 15 : 0;
    roundRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2, 5);
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  if (!alive) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff3860';
    ctx.font = 'bold 34px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('انتهت اللعبة', canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = '#eee';
    ctx.font = '20px Segoe UI';
    ctx.fillText('النقاط: ' + score, canvas.width / 2, canvas.height / 2 + 25);
    ctx.font = '15px Segoe UI';
    ctx.fillStyle = '#00d4ff';
    ctx.fillText('اضغط إعادة للمحاولة', canvas.width / 2, canvas.height / 2 + 65);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function gameOver() {
  alive = false;
  clearInterval(timer);
  draw();
}

function setDir(x, y) {
  if (dir.x === -x && dir.y === -y) return;
  nextDir = { x, y };
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') setDir(0, -1);
  else if (k === 'arrowdown' || k === 's') setDir(0, 1);
  else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
  else if (k === 'arrowright' || k === 'd') setDir(1, 0);
});

document.querySelectorAll('.mobile-pad button').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = btn.dataset.dir;
    if (d === 'up') setDir(0, -1);
    if (d === 'down') setDir(0, 1);
    if (d === 'left') setDir(-1, 0);
    if (d === 'right') setDir(1, 0);
  });
});

document.getElementById('restart').addEventListener('click', init);

init();
</script>
</body>
</html>
